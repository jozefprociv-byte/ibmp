<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИБМП</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ИБМП">
<style>
/* 1. Палітра: чорне й біле. Вночі (темна тема телефона) — навпаки. */
:root{--bg:#fff;--ink:#0a0a0a;--soft:#6b6b6b;--hair:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--ink:#f5f5f5;--soft:#9a9a9a;--hair:#333}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.65 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;border-radius:0}
/* 2. Шапка */
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px double var(--ink)}
header h1{flex:1;margin:0;font-size:20px;letter-spacing:.3em}
.ic{width:40px;height:40px;font-size:22px}
.ic.on{background:var(--ink);color:var(--bg)}
/* 3. Розмова */
#log{flex:1;overflow-y:auto;padding:0 20px;max-width:680px;width:100%;margin:0 auto}
.msg{padding:20px 0;border-bottom:1px solid var(--hair);white-space:pre-wrap}
.who{display:block;font:600 11px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.ai .who::before{content:"— "}
.me{text-align:right;color:var(--soft);font-style:italic}
.me .who{font-style:normal}
/* 4. Нижня панель: рядок вводу, мікрофон, надіслати */
.bar{border-top:1px solid var(--ink);padding:10px 16px}
.bar div{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;font-size:17px;padding:8px 0;border:0;border-bottom:2px solid var(--ink);background:none;color:var(--ink);min-height:44px;max-height:120px;outline:none;border-radius:0}
.sq{width:46px;height:46px;font-size:21px;background:var(--ink);color:var(--bg)}
.sq.rec{background:none;color:var(--ink);outline:2px solid var(--ink);animation:p 1s infinite}
@keyframes p{50%{opacity:.4}}
.sq:disabled{opacity:.35}
/* 5. Шухляда з історією */
#drawer{position:fixed;inset:0;background:var(--bg);transform:translateX(-100%);transition:transform .25s;z-index:5;overflow-y:auto;
 padding:calc(env(safe-area-inset-top) + 12px) 20px 20px}
#drawer.open{transform:none}
#drawer h2{font-size:14px;letter-spacing:.25em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;border-bottom:1px solid var(--hair)}
.row .t{flex:1;text-align:left;padding:14px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .x{color:var(--soft);padding:0 8px}
.row.cur .t{font-weight:700}
.empty{color:var(--soft);font-style:italic}
</style>
</head>
<body>
<header>
  <button class="ic" id="menu" aria-label="Історія">☰</button>
  <h1>ИБМП</h1>
  <button class="ic" id="speak" aria-label="Озвучення відповідей" title="Озвучення">♪</button>
  <button class="ic" id="new" aria-label="Нова розмова">+</button>
</header>
<div id="log"></div>
<div class="bar"><div>
  <textarea id="inp" rows="1" placeholder="Напишіть або натисніть мікрофон…"></textarea>
  <button class="sq" id="mic" aria-label="Говорити">●</button>
  <button class="sq" id="send" aria-label="Надіслати">→</button>
</div></div>
<div id="drawer"><h2>Історія розмов <button class="ic" id="close">✕</button></h2><div id="list"></div></div>

<script>
const $ = id => document.getElementById(id);
const KEY = "ibmp.chats", PASS = "ibmp.pass", SPK = "ibmp.speak";

/* ===== 1. ПАМ’ЯТЬ: усі розмови лежать у телефоні (localStorage) ===== */
let chats = [];           // [{id, ts, msgs:[{role, content}]}]
let cur = null;           // поточна розмова
try { chats = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch (e) {} };

/* ===== 2. ПОЧАТОК І ВІДКРИТТЯ РОЗМОВИ ===== */
const GREETING = "Вітаю Вас. Я не поспішаю з відповідями: моє покликання — допомогти Вам самому дійти до них. З чого почнемо?";

function newChat() {
  cur = { id: Date.now(), ts: Date.now(), msgs: [] };
  render();
}
function openChat(id) {
  cur = chats.find(c => c.id === id); render(); $("drawer").classList.remove("open");
}
function render() {
  $("log").innerHTML = "";
  draw("assistant", GREETING);
  cur.msgs.forEach(m => draw(m.role, m.content));
}
/* textContent, а не innerHTML — чужий текст не може зламати сторінку */
function draw(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "ai");
  const w = document.createElement("span"); w.className = "who"; w.textContent = role === "user" ? "Ви" : "ИБМП";
  const t = document.createElement("span"); t.textContent = text;
  d.append(w, t); $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return t;
}

/* ===== 3. ІСТОРІЯ: список розмов у шухляді ===== */
function showList() {
  const box = $("list"); box.innerHTML = "";
  if (!chats.length) { box.innerHTML = '<p class="empty">Поки порожньо.</p>'; return; }
  [...chats].reverse().forEach(c => {
    const row = document.createElement("div"); row.className = "row" + (c === cur ? " cur" : "");
    const t = document.createElement("button"); t.className = "t";
    t.textContent = (c.msgs[0] ? c.msgs[0].content : "Нова розмова");  // назва = перша Ваша фраза
    t.onclick = () => openChat(c.id);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
    x.onclick = () => { if (confirm("Видалити цю розмову?")) { chats = chats.filter(k => k !== c); save(); if (c === cur) newChat(); showList(); } };
    row.append(t, x); box.appendChild(row);
  });
}

/* ===== 4. ГОЛОВНЕ: надіслати думку серверу й отримати питання ===== */
let busy = false;
async function send() {
  const text = $("inp").value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("inp").value = "";
  if (!chats.includes(cur)) { chats.push(cur); }       // розмова потрапляє в історію з першою фразою
  cur.msgs.push({ role: "user", content: text }); save(); draw("user", text);
  const out = draw("assistant", "…");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json", "x-pass": localStorage.getItem(PASS) || "" },
      body: JSON.stringify({ messages: cur.msgs })       // уся історія: модель сама нічого не пам’ятає
    });
    if (r.status === 401) {                               // попросити код доступу
      const p = prompt("Введіть код доступу:"); if (p) localStorage.setItem(PASS, p);
      throw new Error("Спробуйте ще раз із новим кодом");
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "помилка");
    out.textContent = d.text;
    cur.msgs.push({ role: "assistant", content: d.text }); save();
    say(d.text);
  } catch (e) {
    out.textContent = "Вибачте, зв’язок перервався: " + e.message + ".";
    cur.msgs.pop(); save();                               // не лишаємо питання без відповіді
  }
  busy = false; $("send").disabled = false;
}

/* ===== 5. ГОЛОС: мікрофон (вхід) і озвучення (вихід) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = "";
if (!SR) { $("mic").style.display = "none"; }            // браузер без розпізнавання
else {
  rec = new SR(); rec.lang = "uk-UA"; rec.interimResults = true;
  rec.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(""); $("inp").value = heard; };
  rec.onend = () => { $("mic").classList.remove("rec"); if (heard.trim()) send(); heard = ""; };  // договорили — одразу надсилаємо
  rec.onerror = () => $("mic").classList.remove("rec");
}
$("mic").onclick = () => {
  if ($("mic").classList.contains("rec")) { rec.stop(); return; }
  speechSynthesis.cancel(); heard = ""; $("mic").classList.add("rec"); rec.start();
};
let speakOn = localStorage.getItem(SPK) !== "0";
const paint = () => $("speak").classList.toggle("on", speakOn);
$("speak").onclick = () => { speakOn = !speakOn; localStorage.setItem(SPK, speakOn ? "1" : "0"); if (!speakOn) speechSynthesis.cancel(); paint(); };
function say(t) {
  if (!speakOn || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = "uk-UA"; u.rate = .95; speechSynthesis.speak(u);
}

/* ===== 6. КНОПКИ ===== */
$("send").onclick = send;
$("new").onclick = newChat;
$("menu").onclick = () => { showList(); $("drawer").classList.add("open"); };
$("close").onclick = () => $("drawer").classList.remove("open");
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
paint(); newChat();
</script>
</body>
</html>
